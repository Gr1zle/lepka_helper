name: Python checks
on:
  pull_request:
  push:
    branches: ['build/**', 'release/**']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LEPKA_API_URL: https://example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: LEPKA_DATA_DIR="$RUNNER_TEMP/work/lepka-test-data" python -m unittest discover -s tests -v
      - run: git diff --check
