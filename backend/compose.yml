services:
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LEPKA_API_PORT:-8000}:8000"
    environment:
      LEPKA_MAIL_API_KEY: ${LEPKA_MAIL_API_KEY:-}
      LEPKA_MAIL_FROM: ${LEPKA_MAIL_FROM:-}
    volumes:
      - lepka_data:/data
  caddy:
    image: caddy:2-alpine
    profiles: [public]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      LEPKA_DOMAIN: ${LEPKA_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  lepka_data:
  caddy_data:
  caddy_config:
